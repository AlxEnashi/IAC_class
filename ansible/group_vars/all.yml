# Public repo with the whole demo (HTTPS: no key needed to clone).
# The app lives in its app/ folder. Use your fork's URL if you changed the app.
app_repo_url: "https://github.com/AlxEnashi/IAC_class.git"
app_version: main

# The phrase the API returns. Change it, then re-run site.yml.
api_phrase: "Hello from Ansible"

app_dir: /opt/phrase-api
app_src: "{{ app_dir }}/src/app"   # the app folder inside the cloned repo
app_image: phrase-api:1.0
