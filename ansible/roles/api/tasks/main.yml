- name: Python 3.11 is installed
  ansible.builtin.package:
    name:
      - python3.11
      - python3.11-pip
    state: present

- name: App directory exists
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: ec2-user
    group: ec2-user
    mode: "0755"

- name: Demo repo is cloned (the app is in its app/ folder)
  ansible.builtin.git:
    repo: "{{ app_repo_url }}"
    dest: "{{ app_dir }}/src"
    version: "{{ app_version }}"
  become_user: ec2-user
  notify: Restart phrase-api

- name: Python dependencies are installed in a virtualenv
  ansible.builtin.pip:
    requirements: "{{ app_src }}/requirements.txt"
    virtualenv: "{{ app_dir }}/venv"
    virtualenv_command: python3.11 -m venv
  become_user: ec2-user
  notify: Restart phrase-api

- name: Config directory exists
  ansible.builtin.file:
    path: /etc/phrase-api
    state: directory
    mode: "0755"

- name: Config file has the phrase
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/phrase-api/config.yaml
    mode: "0644"
  notify: Restart phrase-api

- name: systemd unit is installed
  ansible.builtin.template:
    src: phrase-api.service.j2
    dest: /etc/systemd/system/phrase-api.service
    mode: "0644"
  notify: Restart phrase-api

- name: API is running and enabled
  ansible.builtin.systemd_service:
    name: phrase-api
    state: started
    enabled: true
    daemon_reload: true
